services:
  postgres-db:
    image: postgres:16-alpine
    container_name: recipe_postgres
    environment:
      POSTGRES_DB: recipedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipedb"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgrest-api:
    image: postgrest/postgrest:v12.2.0
    container_name: recipe_postgrest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:localdevpassword@postgres-db:5432/recipedb
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
    depends_on:
      postgres-db:
        condition: service_healthy
  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recipe_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_APP_MODE=local
      # Empty = "<current hostname>:3000" (works from a phone on the LAN as well).
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=local-dev-anon-key
    depends_on:
      - postgrest-api
volumes:
  pg_data:
